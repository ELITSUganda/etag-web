<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8bc34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" opacity="0.1"/>
  <g transform="translate(100, 100)">
    <!-- Animal head -->
    <ellipse cx="-10" cy="-20" rx="25" ry="30" fill="#2d5016"/>
    <!-- Horns -->
    <line x1="-30" y1="-40" x2="-45" y2="-60" stroke="#2d5016" stroke-width="3"/>
    <line x1="10" y1="-40" x2="25" y2="-60" stroke="#2d5016" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="-20" cy="-25" r="3" fill="white"/>
    <circle cx="0" cy="-25" r="3" fill="white"/>
    <!-- Body -->
    <ellipse cx="-10" cy="10" rx="35" ry="45" fill="#8bc34a"/>
    <!-- Legs -->
    <rect x="-30" y="40" width="8" height="35" fill="#2d5016"/>
    <rect x="-10" y="40" width="8" height="35" fill="#2d5016"/>
    <rect x="10" y="40" width="8" height="35" fill="#2d5016"/>
    <rect x="30" y="40" width="8" height="35" fill="#2d5016"/>
  </g>
</svg>
