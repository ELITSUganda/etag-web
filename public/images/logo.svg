<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8bc34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#logoGrad)"/>
  <!-- Stylized L for LITS -->
  <g transform="translate(50, 50) scale(0.6)">
    <rect x="-25" y="-30" width="12" height="60" fill="white" rx="2"/>
    <rect x="-25" y="18" width="35" height="12" fill="white" rx="2"/>
    <!-- Tracking symbol -->
    <circle cx="15" cy="-15" r="8" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="15" cy="-15" r="6" fill="none" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
